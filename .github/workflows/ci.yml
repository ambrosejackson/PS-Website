name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Next 16 generates route/layout types (LayoutProps, PageProps, ...) into
      # .next/types; a fresh runner has none, so tsc must run after typegen.
      - run: npx next typegen
      - run: npm run typecheck
